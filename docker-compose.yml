services:
  api:
    build: ./api
    image: fp-collector-api:1.0.0
    expose:
      - "8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.fpcollector.rule=Host(`fp.growthframe.hu`)
      - traefik.http.routers.fpcollector.entrypoints=web
      - traefik.http.services.fpcollector.loadbalancer.server.port=8000

  worker:
    build: ./api
    image: fp-collector-api:1.0.0
    command: python worker.py
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  simulator:
    build: ./api
    image: fp-collector-api:1.0.0
    command: python simulator.py
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  db:
    image: postgres:16.3
    expose:
      - "5432"
    # Phase 2: bind DB port to the homelab LAN IP so martech-lab's n8n can reach it.
    # Dev defaults bind to 127.0.0.1:15432 (host port 15432 → container 5432) to avoid
    # colliding with a system PostgreSQL. On dokploy-lab set POSTGRES_BIND_IP=192.168.1.50
    # and POSTGRES_HOST_PORT=5432. Not publicly exposed — NPM never routes this port.
    ports:
      - "${POSTGRES_BIND_IP:-127.0.0.1}:${POSTGRES_HOST_PORT:-15432}:5432"
    env_file: .env
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

networks:
  internal:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  db_data:
