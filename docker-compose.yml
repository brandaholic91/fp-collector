services:
  api:
    build: ./api
    image: fp-collector-api:1.0.0
    expose:
      - "8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - proxy-net

  db:
    image: postgres:16.3
    expose:
      - "5432"
    env_file: .env
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

networks:
  internal:
    driver: bridge
  proxy-net:
    external: true
