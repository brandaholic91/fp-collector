name: Compose Redeploy

on:
  push:
    branches:
      - main

concurrency:
  group: fp-collector-deploy
  cancel-in-progress: false

jobs:
  redeploy:
    runs-on: [self-hosted, linux]
    steps:
      - name: Deploy latest commit on dokploy-lab
        shell: bash
        run: |
          set -euxo pipefail
          APP_DIR="/etc/dokploy/compose/fpcollector-stack-0xbwzg/code"
          BRANCH="main"
          TOKEN="${{ github.token }}"

          git config --global --add safe.directory "$APP_DIR" || true
          git -C "$APP_DIR" remote set-url origin "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"
          git -C "$APP_DIR" fetch origin "$BRANCH"
          git -C "$APP_DIR" checkout "$BRANCH"
          git -C "$APP_DIR" reset --hard "origin/$BRANCH"
          git -C "$APP_DIR" clean -fd

          cd "$APP_DIR"
          docker compose --env-file .env pull db || true
          docker compose --env-file .env up -d --build --remove-orphans
