name: Compose Redeploy

on:
  push:
    branches:
      - main

concurrency:
  group: fp-collector-deploy
  cancel-in-progress: false

jobs:
  redeploy:
    runs-on: [self-hosted, linux]
    steps:
      - name: Deploy latest commit on dokploy-lab
        shell: bash
        env:
          COMPOSE_DIR: /etc/dokploy/compose/fpcollector-stack-0xbwzg/code
          COMPOSE_FILE: /etc/dokploy/compose/fpcollector-stack-0xbwzg/code/docker-compose.yml
          COMPOSE_PROJECT_NAME: fpcollector-stack-0xbwzg
        run: |
          set -euo pipefail
          test -d "$COMPOSE_DIR"
          cd "$COMPOSE_DIR"
          git fetch origin main
          git checkout main
          git reset --hard "$GITHUB_SHA"
          docker compose -p "$COMPOSE_PROJECT_NAME" -f "$COMPOSE_FILE" up -d --build --remove-orphans
